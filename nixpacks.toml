[phases.setup]
cmds = ["apk add --no-cache make gcc musl-dev sqlite-dev"]

[phases.install]
cmds = [
  "cd frontend && npm ci",
  "go mod download"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "CGO_ENABLED=1 go build -ldflags \"-w -s\" -o x-ui main.go"
]

[start]
cmd = "bash -c 'export NGINX_PORT=${PORT:-3000} && envsubst \"${NGINX_PORT}\" < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && ./x-ui & sleep 2 && nginx -g \"daemon off;\"'"

[variables]
PORT = "3000"