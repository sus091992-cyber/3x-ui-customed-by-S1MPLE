version: '3.8'

services:
  panel:
    image: ghcr.io/mhsanaei/3x-ui:latest
    environment:
      - XUI_DB_TYPE=sqlite
      - XUI_DB_DSN=/etc/x-ui/x-ui.db
      - XUI_ENABLE_FAIL2BAN=true
    volumes:
      - panel-data:/etc/x-ui
    ports:
      - "2053:2053"
      - "2096:2096"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${PORT}:3000"
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./start.sh:/start.sh:ro
    environment:
      - PORT=${PORT:-3000}
    command: /bin/bash /start.sh
    depends_on:
      - panel
    restart: unless-stopped

volumes:
  panel-data: